name: Mypy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'frontends/python/**'
      - 'oss_fuzz_integration/**'
      - 'tools/**'
      - '.github/workflows/mypy.yml'
  push:
    branches:
      - memory-improvements
    paths:
      - 'src/**'
      - 'frontends/python/**'
      - 'oss_fuzz_integration/**'
      - 'tools/**'
      - '.github/workflows/mypy.yml'
permissions: read-all
jobs:
  build:
    runs-on: ubuntu-latest
    name: Mypy
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v2.4.0
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v3.0.0
      with:
        python-version: "3.11"
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxml2-dev libxslt-dev
    - name: Install Dependencies
      run: |
        pip install mypy types-PyYAML
    - name: Install FI as modules
      run: |
        cd src && pip install .
    - name: mypy
      run: |
        cd src && mypy --ignore-missing-imports -m main
