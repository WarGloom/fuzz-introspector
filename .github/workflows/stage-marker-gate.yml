name: Stage Marker Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/run_stage_marker_gate.py'
      - 'benchmarks/validate_stage_marker_regression.py'
      - 'src/fuzz_introspector/stage_markers.py'
      - 'src/test/test_stage_markers.py'
      - 'src/test/test_run_stage_marker_gate.py'
      - '.github/workflows/stage-marker-gate.yml'
  push:
    branches:
      - memory-improvements
    paths:
      - 'benchmarks/run_stage_marker_gate.py'
      - 'benchmarks/validate_stage_marker_regression.py'
      - 'src/fuzz_introspector/stage_markers.py'
      - 'src/test/test_stage_markers.py'
      - 'src/test/test_run_stage_marker_gate.py'
      - '.github/workflows/stage-marker-gate.yml'

permissions: read-all

jobs:
  stage-marker-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v2.4.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v3.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run stage-marker unit tests
        run: |
          PYTHONPATH=src python -m pytest -vv src/test/test_stage_markers.py src/test/test_run_stage_marker_gate.py

      - name: Run stage-marker gate smoke test
        run: |
          smoke_dir="${RUNNER_TEMP}/stage-marker-gate-smoke"
          mkdir -p "${smoke_dir}"

          cat > "${smoke_dir}/baseline.log" <<'EOF'
          2026-03-03T10:00:00.000000Z optional_analyses start {}
          2026-03-03T10:00:02.000000Z optional_analyses end {}
          2026-03-03T10:00:10.000000Z report_generation start {}
          2026-03-03T10:00:14.000000Z report_generation end {}
          EOF

          cat > "${smoke_dir}/candidate.log" <<'EOF'
          2026-03-03T10:00:00.000000Z optional_analyses start {}
          2026-03-03T10:00:02.100000Z optional_analyses end {}
          2026-03-03T10:00:10.000000Z report_generation start {}
          2026-03-03T10:00:14.200000Z report_generation end {}
          EOF

          PYTHONPATH=src python benchmarks/run_stage_marker_gate.py \
            --baseline-log "${smoke_dir}/baseline.log" \
            --candidate-log "${smoke_dir}/candidate.log" \
            --output-json "${smoke_dir}/stage-gate.json"

          python -c "import json, pathlib; p=pathlib.Path('${smoke_dir}/stage-gate.json'); data=json.loads(p.read_text(encoding='utf-8')); assert data.get('ok') is True, data"
