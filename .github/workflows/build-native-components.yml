name: Build Native Components

on:
  push:
    branches: [ main, memory-improvements ]
  pull_request:
    branches: [ main, memory-improvements ]

permissions:
  contents: read

jobs:
  build-native:
    name: Build ${{ matrix.tool.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool:
          - path: tools/native_debug_correlator_rust
            name: native_debug_correlator_rust
          - path: tools/native_yaml_loader_rust
            name: native_yaml_loader_rust
          - path: tools/native_llvm_cov_loader_rust
            name: native_llvm_cov_loader_rust
          - path: tools/native_overlay_backend_rust
            name: native_overlay_backend_rust
          - path: tools/native_analysis_plugins_rust
            name: native_analysis_plugins_rust
          - path: tools/native_reachability_rust
            name: native_reachability_rust
          - path: tools/native_filter_functions_rust
            name: native_filter_functions_rust
          - path: tools/native_calltree_bitmap_rust
            name: native_calltree_bitmap_rust
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.tool.path }}/target
          key: ${{ runner.os }}-cargo-${{ matrix.tool.name }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.tool.path)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.tool.name }}-
      - name: Build ${{ matrix.tool.name }}
        run: |
          cd ${{ matrix.tool.path }}
          cargo build --release
          cargo test
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.tool.name }}-linux
          path: ${{ matrix.tool.path }}/target/release/${{ matrix.tool.name }}
          if-no-files-found: error

  build-go-native:
    name: Build ${{ matrix.tool.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool:
          - path: tools/native_yaml_loader_go
            name: native_yaml_loader_go
          - path: tools/native_llvm_cov_loader_go
            name: native_llvm_cov_loader_go
          - path: tools/native_debug_correlator_go
            name: native_debug_correlator_go
          - path: tools/native_overlay_backend_go
            name: native_overlay_backend_go
          - path: tools/native_analysis_plugins_go
            name: native_analysis_plugins_go
          - path: tools/native_reachability_go
            name: native_reachability_go
          - path: tools/native_filter_functions_go
            name: native_filter_functions_go
          - path: tools/native_calltree_bitmap_go
            name: native_calltree_bitmap_go
    steps:
      - uses: actions/checkout@v6
      - name: Install Go 1.22
        uses: actions/setup-go@v6
        with:
          go-version: '1.22.6'
      - name: Build and test ${{ matrix.tool.name }}
        run: |
          cd ${{ matrix.tool.path }}
          go test ./...
          go build -o ${{ matrix.tool.name }} .
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.tool.name }}-linux
          path: ${{ matrix.tool.path }}/${{ matrix.tool.name }}
          if-no-files-found: error
